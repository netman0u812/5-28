function _mbFmt(mb) {
  if (!mb || mb <= 0) return '0 B';
  if (mb >= 1e6) return (mb/1e6).toFixed(2) + ' TB';
  if (mb >= 1000) return (mb/1000).toFixed(2) + ' GB';
  if (mb >= 1) return mb.toFixed(1) + ' MB';
  if (mb >= 0.001) return (mb*1000).toFixed(0) + ' KB';
  return (mb*1e6).toFixed(0) + ' B';
}

function drawPartnerTrafficChart(paneId, D) {
  var psd = D.partnerSrcDst;
  if (!psd || !Object.keys(psd).length) return;

  // Build name list from traffic data directly — VPN registry is optional
  var names = Object.keys(psd).filter(function(n){
    return n !== 'INTERNAL' && (psd[n].src > 0 || psd[n].dst > 0);
  });
  if (!names.length) return;
  names.sort(function(a,b){
    return (psd[b].src+psd[b].dst)-(psd[a].src+psd[a].dst);
  });

  // Build VPN status lookup from vpnGroups if available (optional annotation)
  var statusMap = {};
  (D.vpnGroups||[]).forEach(function(g){ statusMap[g.name] = g.status; });
  var statusColor = {ACTIVE:'#4ade80', CONFIGURED:'#22d3ee', INACTIVE:'#4a5264'};

  var ROW_H=40, PAD_L=190, PAD_R=95, PAD_T=58, PAD_B=16;
  var W=820, H=PAD_T + names.length*ROW_H + PAD_B;
  var c=document.createElement('canvas');
  var dpr=window.devicePixelRatio||1;
  c.width=W*dpr; c.height=H*dpr;
  c.style.cssText='display:block;max-width:100%;width:'+W+'px;height:'+H+'px;margin:24px 0 8px;border:1px solid #1a1f28;background:#0e1015';
  document.getElementById(paneId).appendChild(c);
  var ctx=c.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.fillStyle='#0e1015'; ctx.fillRect(0,0,W,H);

  var maxMB=0;
  names.forEach(function(n){ var d=psd[n]||{src:0,dst:0}; maxMB=Math.max(maxMB,d.src,d.dst); });
  if (!maxMB) return;
  var barW=W-PAD_L-PAD_R;

  // Section heading
  ctx.fillStyle='#22d3ee'; ctx.font='bold 9px monospace'; ctx.textAlign='left';
  ctx.fillText('VPN PARTNER DATA VOLUME — SAMPLE PERIOD TOTAL',PAD_L,15);

  // Legend
  ctx.fillStyle='rgba(34,211,238,0.75)'; ctx.fillRect(PAD_L,24,11,9);
  ctx.fillStyle='#8b9ab0'; ctx.font='10px sans-serif';
  ctx.fillText('Sent  (CVS → Partner)',PAD_L+15,33);
  ctx.fillStyle='rgba(251,191,36,0.75)'; ctx.fillRect(PAD_L+175,24,11,9);
  ctx.fillStyle='#8b9ab0';
  ctx.fillText('Received  (Partner → CVS)',PAD_L+190,33);

  // X-axis scale ticks
  for (var t=0;t<=4;t++) {
    var tx=PAD_L+Math.round((t/4)*barW);
    ctx.fillStyle='#2a3040'; ctx.fillRect(tx,PAD_T-4,1,names.length*ROW_H+4);
    ctx.fillStyle='#4a5264'; ctx.font='8px monospace'; ctx.textAlign='center';
    ctx.fillText(_mbFmt(maxMB*(t/4)),tx,PAD_T-7);
  }
  ctx.textAlign='left';

  names.forEach(function(name,i) {
    var y=PAD_T+i*ROW_H;
    var d=psd[name]||{src:0,dst:0};
    var shortName=name.replace(/_ACCESS$/,'').replace(/_HOST$/,'').replace(/_SUBNETS$/,'');

    // Alternating row bg
    if (i%2===0) { ctx.fillStyle='rgba(255,255,255,0.018)'; ctx.fillRect(0,y,W,ROW_H); }

    // Partner label
    ctx.fillStyle='#dde2ec'; ctx.font='600 11px sans-serif'; ctx.textAlign='right';
    ctx.fillText(shortName,PAD_L-8,y+14);
    // Status dot (if VPN registry was loaded)
    var st = statusMap[name];
    if (st) {
      ctx.fillStyle = statusColor[st] || '#4a5264';
      ctx.beginPath(); ctx.arc(PAD_L-3, y+6, 3, 0, Math.PI*2); ctx.fill();
    }
    ctx.textAlign='left';

    // SRC bar (top, cyan)
    var srcW=Math.max(d.src>0?2:0,Math.round((d.src/maxMB)*barW));
    ctx.fillStyle='rgba(34,211,238,0.75)'; ctx.fillRect(PAD_L,y+2,srcW,16);
    // SRC label
    if (srcW>0) {
      ctx.fillStyle='#22d3ee'; ctx.font='9px monospace';
      var srcLabelX=PAD_L+srcW+4;
      if (srcLabelX+55>W-PAD_R) srcLabelX=PAD_L+srcW-60;
      ctx.fillText(_mbFmt(d.src),srcLabelX,y+13);
    }

    // DST bar (bottom, amber)
    var dstW=Math.max(d.dst>0?2:0,Math.round((d.dst/maxMB)*barW));
    ctx.fillStyle='rgba(251,191,36,0.75)'; ctx.fillRect(PAD_L,y+20,dstW,15);
    // DST label
    if (dstW>0) {
      ctx.fillStyle='#fbbf24'; ctx.font='9px monospace';
      var dstLabelX=PAD_L+dstW+4;
      if (dstLabelX+55>W-PAD_R) dstLabelX=PAD_L+dstW-60;
      ctx.fillText(_mbFmt(d.dst),dstLabelX,y+30);
    }

    // Row divider
    ctx.fillStyle='#1a1f28'; ctx.fillRect(0,y+ROW_H-1,W,1);
  });

  // Bottom axis line
  ctx.fillStyle='#252c38'; ctx.fillRect(PAD_L,PAD_T+names.length*ROW_H,barW,1);
}

function drawDailyTimelineChart(paneId, D) {
  if (!D.dailySrcDst) return;
  var days=Object.keys(D.dailySrcDst).sort();
  if (days.length<2) return;

  var W=820, H=240, PAD_L=70, PAD_R=20, PAD_T=52, PAD_B=44;
  var c=document.createElement('canvas');
  var dpr=window.devicePixelRatio||1;
  c.width=W*dpr; c.height=H*dpr;
  c.style.cssText='display:block;max-width:100%;width:'+W+'px;height:'+H+'px;margin:16px 0 28px;border:1px solid #1a1f28;background:#0e1015';
  document.getElementById(paneId).appendChild(c);
  var ctx=c.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.fillStyle='#0e1015'; ctx.fillRect(0,0,W,H);

  var maxMB=0;
  days.forEach(function(d){ maxMB=Math.max(maxMB,D.dailySrcDst[d].src,D.dailySrcDst[d].dst); });
  if (!maxMB) return;

  var chartW=W-PAD_L-PAD_R, chartH=H-PAD_T-PAD_B;
  var step=chartW/(days.length-1);
  function xOf(i){ return PAD_L+i*step; }
  function yOf(v){ return PAD_T+chartH-Math.round((v/maxMB)*chartH); }

  // Heading
  ctx.fillStyle='#22d3ee'; ctx.font='bold 9px monospace'; ctx.textAlign='left';
  ctx.fillText('DAILY DATA VOLUME OVER SAMPLE PERIOD',PAD_L,16);

  // Legend
  ctx.fillStyle='rgba(34,211,238,0.75)'; ctx.fillRect(PAD_L,25,11,8);
  ctx.fillStyle='#8b9ab0'; ctx.font='10px sans-serif';
  ctx.fillText('Sent (CVS → Partner)',PAD_L+15,33);
  ctx.fillStyle='rgba(251,191,36,0.75)'; ctx.fillRect(PAD_L+175,25,11,8);
  ctx.fillStyle='#8b9ab0';
  ctx.fillText('Received (Partner → CVS)',PAD_L+190,33);

  // Horizontal grid lines
  for (var g=0;g<=4;g++) {
    var gy=PAD_T+Math.round((g/4)*chartH);
    ctx.strokeStyle='#1a1f28'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(PAD_L,gy); ctx.lineTo(PAD_L+chartW,gy); ctx.stroke();
    ctx.fillStyle='#4a5264'; ctx.font='9px monospace'; ctx.textAlign='right';
    ctx.fillText(_mbFmt(maxMB*(1-g/4)),PAD_L-5,gy+3);
  }
  ctx.textAlign='left';

  // Draw filled areas then lines, DST first so SRC renders on top
  [{key:'dst',fill:'rgba(251,191,36,0.08)',stroke:'rgba(251,191,36,0.8)',lw:1.5},
   {key:'src',fill:'rgba(34,211,238,0.12)',stroke:'rgba(34,211,238,0.85)',lw:1.5}
  ].forEach(function(cfg) {
    // Filled area
    ctx.beginPath();
    ctx.moveTo(xOf(0),yOf(0));
    days.forEach(function(d,i){ ctx.lineTo(xOf(i),yOf(D.dailySrcDst[d][cfg.key])); });
    ctx.lineTo(xOf(days.length-1),yOf(0));
    ctx.closePath();
    ctx.fillStyle=cfg.fill; ctx.fill();

    // Line
    ctx.beginPath();
    days.forEach(function(d,i){
      var x=xOf(i), y=yOf(D.dailySrcDst[d][cfg.key]);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.strokeStyle=cfg.stroke; ctx.lineWidth=cfg.lw; ctx.stroke();

    // Dots at each data point
    ctx.fillStyle=cfg.stroke;
    days.forEach(function(d,i){
      var v=D.dailySrcDst[d][cfg.key];
      if(v>0){
        ctx.beginPath(); ctx.arc(xOf(i),yOf(v),2.5,0,Math.PI*2); ctx.fill();
      }
    });
  });

  // X-axis baseline
  ctx.strokeStyle='#252c38'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(PAD_L,PAD_T+chartH); ctx.lineTo(PAD_L+chartW,PAD_T+chartH); ctx.stroke();

  // X-axis date labels
  var labelEvery=Math.max(1,Math.ceil(days.length/10));
  ctx.fillStyle='#4a5264'; ctx.font='9px monospace'; ctx.textAlign='center';
  days.forEach(function(d,i){
    if(i%labelEvery===0 || i===days.length-1){
      var x=xOf(i);
      ctx.fillText(d.slice(5),x,H-PAD_B+14);  // MM-DD
      ctx.strokeStyle='#252c38'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(x,PAD_T+chartH); ctx.lineTo(x,PAD_T+chartH+5); ctx.stroke();
    }
  });
}

  if(id==="pane-r"){
    var rr=D.riskRows;
    var h="<div class=\"st\">Risk Events &mdash; "+rr.length+(rr.length===2000?" (capped at 2,000)":"")+"</div>";
    if(!rr.length){h+="<div style=\"color:var(--dim);padding:20px 0\">No HIGH or MED risk events.</div>";}
    else{
      h+="<input class=\"sb\" id=\"rk-sb\" placeholder=\"Search partner, IP, service\u2026\" oninput=\"filterTable('rk-sb','rk-tb')\"><span id=\"rk-sb_c\" style=\"font-family:monospace;font-size:10px;color:var(--dim);margin-left:8px\"></span>"+
        "<div class=\"tw\"><table id=\"rk-t\"><thead><tr>"+
        "<th onclick=\"sortTable('rk-t',0)\">Risk</th><th onclick=\"sortTable('rk-t',1)\">Site</th>"+
        "<th onclick=\"sortTable('rk-t',2)\">Partner</th><th onclick=\"sortTable('rk-t',3)\">Subject IP</th>"+
        "<th onclick=\"sortTable('rk-t',4)\">Peer IP</th><th onclick=\"sortTable('rk-t',5)\">Service</th>"+
        "<th onclick=\"sortTable('rk-t',6)\">Protocol</th><th onclick=\"sortTable('rk-t',7)\">Bytes</th>"+
        "</tr></thead><tbody id=\"rk-tb\">";
      rr.forEach(function(r){
        h+="<tr><td>"+(r.risk==="HIGH"?"<span class=\"bh\">HIGH</span>":"<span class=\"bm\">MED</span>")+"</td>"+
          "<td>"+sbadge(r.site)+"</td><td style=\"color:var(--bright)\">"+esc(r.partner)+"</td>"+
          "<td style=\"color:var(--accent)\">"+esc(r.subj)+"</td><td style=\"color:var(--dim)\">"+esc(r.peer)+"</td>"+
          "<td>"+esc(r.svc)+"</td><td>"+esc(r.proto)+"</td><td>"+esc(r.bytes)+"</td></tr>";
      });
      h+="</tbody></table></div>";
    }
    document.getElementById(id).innerHTML=h;
  }
  if(id==="pane-v"){
    var gs=D.vpnGroups;
    var h="<div class=\"st\">VPN Partner Registry &mdash; "+gs.length+" partners</div>"+
      "<input class=\"sb\" id=\"vg-sb\" placeholder=\"Search partner, site, status\u2026\" oninput=\"filterTable('vg-sb','vg-tb')\"><span id=\"vg-sb_c\" style=\"font-family:monospace;font-size:10px;color:var(--dim);margin-left:8px\"></span>"+
      "<div class=\"tw\"><table id=\"vg-t\"><thead><tr>"+
      "<th onclick=\"sortTable('vg-t',0)\">Partner</th><th onclick=\"sortTable('vg-t',1)\">Status</th>"+
      "<th onclick=\"sortTable('vg-t',2)\">Sites</th><th onclick=\"sortTable('vg-t',3)\">Peers</th>"+
      "<th onclick=\"sortTable('vg-t',4)\">Local</th><th onclick=\"sortTable('vg-t',5)\">Remote</th>"+
      "<th onclick=\"sortTable('vg-t',6)\">IKEv1</th><th onclick=\"sortTable('vg-t',7)\">Weak PFS</th>"+
      "</tr></thead><tbody id=\"vg-tb\">";
    gs.forEach(function(g){
      var st=g.status==="ACTIVE"?"<span class=\"ba\">ACTIVE</span>":g.status==="CONFIGURED"?"<span class=\"bc\">CONFIGURED</span>":"<span class=\"bi\">INACTIVE</span>";
      var sites=(g.siteArr||[]).map(sbadge).join(" ");
      h+="<tr><td style=\"color:var(--bright);font-weight:600\">"+esc(g.name)+"</td><td>"+st+"</td><td>"+sites+"</td>"+
        "<td style=\"color:var(--dim)\">"+g.peerCount+"</td><td style=\"color:var(--accent)\">"+g.localNets+"</td>"+
        "<td style=\"color:var(--dim)\">"+g.remoteNets+"</td>"+
        "<td>"+(g.ike1Count>0?"<span class=\"b1\">"+g.ike1Count+"</span>":"<span style=\"color:var(--dim)\">0</span>")+"</td>"+
        "<td>"+(g.weakCount>0?"<span class=\"bw\">"+g.weakCount+"</span>":"<span style=\"color:var(--dim)\">0</span>")+"</td></tr>";
    });
    h+="</tbody></table></div>";
    document.getElementById(id).innerHTML=h;
  }
  if(id==="pane-i"){
    var pp=D.vpnPeers;
    var h="<div class=\"st\">ISAKMP Peer Registry &mdash; "+pp.length+" peers</div>"+
      "<input class=\"sb\" id=\"ip-sb\" placeholder=\"Search partner, IP, gateway, transform set\u2026\" oninput=\"filterTable('ip-sb','ip-tb')\"><span id=\"ip-sb_c\" style=\"font-family:monospace;font-size:10px;color:var(--dim);margin-left:8px\"></span>"+
      "<div class=\"tw\"><table id=\"ip-t\"><thead><tr>"+
      "<th onclick=\"sortTable('ip-t',0)\">Partner</th><th onclick=\"sortTable('ip-t',1)\">Site</th>"+
      "<th onclick=\"sortTable('ip-t',2)\">Local GW</th><th onclick=\"sortTable('ip-t',3)\">Peer IP</th>"+
      "<th onclick=\"sortTable('ip-t',4)\">IKE</th><th onclick=\"sortTable('ip-t',5)\">PFS</th>"+
      "<th onclick=\"sortTable('ip-t',6)\">Transform Set</th>"+
      "<th onclick=\"sortTable('ip-t',7)\">Local</th><th onclick=\"sortTable('ip-t',8)\">Remote</th>"+
      "</tr></thead><tbody id=\"ip-tb\">";
    pp.forEach(function(p){
      var site=(p.gateway_site||"").toUpperCase();
      var sc={SHEA:"#60a5fa",WOONSOCKET:"#a78bfa",WDC:"#fb923c",MDC:"#4ade80"}[site]||"#5a6a7a";
      var ike1=p.ike_version==="1";
      var weak=["group1","group2","group5"].includes((p.pfs_group||"").toLowerCase());
      h+="<tr><td style=\"color:var(--bright);font-weight:600\">"+esc(p.partner_name||p.peer_ip)+"</td>"+
        "<td><span style=\"display:inline-block;padding:1px 6px;border-radius:1px;font-size:9px;font-weight:700;background:"+sc+"22;color:"+sc+"\">"+esc(site)+"</span></td>"+
        "<td style=\"color:var(--dim)\">"+esc(p.local_gateway)+"</td>"+
        "<td style=\"color:var(--accent)\">"+esc(p.peer_ip)+"</td>"+
        "<td>"+(ike1?"<span class=\"b1\">IKEv1</span>":"<span class=\"b2\">IKEv2</span>")+"</td>"+
        "<td>"+(weak?"<span class=\"bw\">"+esc(p.pfs_group)+"</span>":esc(p.pfs_group)||"<span style=\"color:var(--dim)\">\u2014</span>")+"</td>"+
        "<td style=\"color:var(--dim);font-size:10px\">"+esc(p.transform_set)+"</td>"+
        "<td style=\"text-align:center\">"+esc(p.local_subnet_count||0)+"</td>"+
        "<td style=\"text-align:center;color:var(--dim)\">"+esc(p.remote_subnet_count||0)+"</td></tr>";
    });
    h+="</tbody></table></div>";
    document.getElementById(id).innerHTML=h;
  }
}
buildPane("pane-s");</script></body></html>
